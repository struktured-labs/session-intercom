[project]
name = "session-intercom"
version = "0.4.0"
description = "MCP server for inter-session communication between Claude Code sessions"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
session-intercom = "session_intercom.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/session_intercom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
